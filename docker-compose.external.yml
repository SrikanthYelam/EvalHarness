# EvalHarness only, pointed at a RAG API that is already running somewhere else (your machine, staging, a hosted
# service). Set RAG_API_URL and run:
#
#   RAG_API_URL=http://host.docker.internal:8080 docker compose -f docker-compose.external.yml run --rm --build evalharness
#
# From a container, `localhost` is the container itself; use host.docker.internal for an API on your machine.
# Pass different CLI arguments by appending them, e.g.:
#   ... run --rm evalharness run --dataset /datasets/acme-handbook.json --output /reports --evaluators exact-match,retrieval-quality
name: evalharness-external

services:
  evalharness:
    build: .
    environment:
      # Needed by the LLM/embedding-based evaluators; may be empty when running only --evaluators that need no provider.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EVALHARNESS_RagApi__BaseUrl: ${RAG_API_URL:?Set RAG_API_URL to the RAG API base URL}
      EVALHARNESS_RagApi__WaitForReadySeconds: ${RAG_WAIT_SECONDS:-60}
      # For APIs that need auth, set e.g. EVALHARNESS_RagApi__Headers__Authorization in your shell or .env and add it here.
      EVALHARNESS_Baseline: ${EVAL_BASELINE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${EVAL_UID:-0}:${EVAL_GID:-0}"
    volumes:
      - ./datasets:/datasets:ro
      - ./baselines:/baselines:ro
      - ./reports:/reports
    command: ["run", "--dataset", "/datasets/${EVAL_DATASET:-acme-handbook.json}", "--output", "/reports"]
